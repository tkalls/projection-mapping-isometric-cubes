<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="640" viewBox="0 0 1200 640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Which spin keeps the most cube</title><rect width="1200" height="640" rx="18" fill="#0d1017"/><text x="40.0" y="58.0" font-size="30" fill="#e8ecf3" font-weight="700" text-anchor="start"><tspan fill="#ffd23f">6</tspan>  Which spin keeps the most “cube”?</text><text x="40.0" y="92.0" font-size="18" fill="#9aa4b2" font-weight="400" text-anchor="start">Each motion was simulated for 2 minutes and its outline compared with the perfect isometric hexagon.</text><text x="300.0" y="122.0" font-size="13" fill="#9aa4b2" font-weight="400" text-anchor="start">average match to the hexagon</text><text x="770.0" y="122.0" font-size="13" fill="#9aa4b2" font-weight="400" text-anchor="start">time near-perfect</text><text x="284.0" y="154.0" font-size="16.5" fill="#e8ecf3" font-weight="700" text-anchor="end">90° turntable steps</text><rect x="300" y="136" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="136" width="376.9" height="26" rx="6" fill="#ffd23f"/><text x="668.9" y="154.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">95.7%</text><text x="770.0" y="154.0" font-size="15" fill="#e8ecf3" font-weight="700" text-anchor="start">76%</text><text x="835.0" y="154.0" font-size="13.5" fill="#ffd23f" font-weight="600" text-anchor="start">winner: real 3D turns, locks back in</text><text x="284.0" y="200.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">120° diagonal steps</text><rect x="300" y="182" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="182" width="393.1" height="26" rx="6" fill="#4c8dff"/><text x="685.1" y="200.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">96.8%</text><text x="770.0" y="200.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">74%</text><text x="835.0" y="200.0" font-size="13.5" fill="#9aa4b2" font-weight="400" text-anchor="start">higher, but a flat spin, no depth</text><text x="284.0" y="246.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Rock</text><rect x="300" y="228" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="228" width="334.4" height="26" rx="6" fill="#4c8dff"/><text x="626.4" y="246.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">92.8%</text><text x="770.0" y="246.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">19%</text><text x="835.0" y="246.0" font-size="13.5" fill="#9aa4b2" font-weight="400" text-anchor="start">never drops below 88%</text><text x="284.0" y="292.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Diagonal</text><rect x="300" y="274" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="274" width="308.0" height="26" rx="6" fill="#4c8dff"/><text x="600.0" y="292.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">91.0%</text><text x="770.0" y="292.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">22%</text><text x="284.0" y="338.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Turntable</text><rect x="300" y="320" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="320" width="240.5" height="26" rx="6" fill="#4c8dff"/><text x="532.5" y="338.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">86.4%</text><text x="770.0" y="338.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">23%</text><text x="284.0" y="384.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Roll</text><rect x="300" y="366" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="366" width="230.3" height="26" rx="6" fill="#4c8dff"/><text x="522.3" y="384.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">85.7%</text><text x="770.0" y="384.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">19%</text><text x="284.0" y="430.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Multi-axis</text><rect x="300" y="412" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="412" width="198.0" height="26" rx="6" fill="#4c8dff"/><text x="490.0" y="430.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">83.5%</text><text x="770.0" y="430.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">6%</text><text x="284.0" y="476.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Tumble</text><rect x="300" y="458" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="458" width="193.6" height="26" rx="6" fill="#4c8dff"/><text x="485.6" y="476.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">83.2%</text><text x="770.0" y="476.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">7%</text><text x="284.0" y="522.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Figure eight</text><rect x="300" y="504" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="504" width="173.1" height="26" rx="6" fill="#4c8dff"/><text x="465.1" y="522.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">81.8%</text><text x="770.0" y="522.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">2%</text><text x="284.0" y="568.0" font-size="16.5" fill="#9aa4b2" font-weight="500" text-anchor="end">Diamond</text><rect x="300" y="550" width="440" height="26" rx="6" fill="#151a23"/><rect x="300" y="550" width="139.3" height="26" rx="6" fill="#4c8dff"/><text x="431.3" y="568.0" font-size="14" fill="#0d1017" font-weight="800" text-anchor="end">79.5%</text><text x="770.0" y="568.0" font-size="15" fill="#9aa4b2" font-weight="500" text-anchor="start">0%</text><text x="300.0" y="610.0" font-size="12" fill="#9aa4b2" font-weight="400" text-anchor="start" font-style="italic">bars start at 70%</text></svg>