<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="650" viewBox="0 0 1200 650" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Every room corner is the inside of a cube</title><rect width="1200" height="650" rx="18" fill="#0d1017"/><text x="40.0" y="58.0" font-size="30" fill="#e8ecf3" font-weight="700" text-anchor="start"><tspan fill="#ffd23f">1</tspan>  Every room corner is the inside of a cube</text><text x="40.0" y="92.0" font-size="18" fill="#9aa4b2" font-weight="400" text-anchor="start">Where your ceiling meets two walls, three flat surfaces meet at 90°, exactly like the inside of a box.</text><polygon points="300.0,335.0 128.5,236.0 300.0,137.0 471.5,236.0" fill="#4c8dff" fill-opacity="0.16" stroke="none" stroke-width="0" stroke-linejoin="round"/><polygon points="300.0,335.0 128.5,236.0 128.5,434.0 300.0,533.0" fill="#ff8a3d" fill-opacity="0.14" stroke="none" stroke-width="0" stroke-linejoin="round"/><polygon points="300.0,335.0 471.5,236.0 471.5,434.0 300.0,533.0" fill="#35d07f" fill-opacity="0.14" stroke="none" stroke-width="0" stroke-linejoin="round"/><polygon points="170.1,260.0 300.0,185.0 429.9,260.0 429.9,410.0 300.0,485.0 170.1,410.0" fill="none" fill-opacity="1.0" stroke="#e8ecf3" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 6"/><line x1="300.0" y1="335.0" x2="128.5" y2="236.0" stroke="#e8ecf3" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/><line x1="300.0" y1="335.0" x2="471.5" y2="236.0" stroke="#e8ecf3" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/><line x1="300.0" y1="335.0" x2="300.0" y2="533.0" stroke="#e8ecf3" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/><circle cx="300.0" cy="335.0" r="8" fill="#ffd23f" stroke="#0d1017" stroke-width="3"/><text x="300.0" y="215.0" font-size="19" fill="#4c8dff" font-weight="700" text-anchor="middle">ceiling</text><text x="205.0" y="430.0" font-size="19" fill="#ff8a3d" font-weight="700" text-anchor="middle">left wall</text><text x="395.0" y="430.0" font-size="19" fill="#35d07f" font-weight="700" text-anchor="middle">right wall</text><text x="316.0" y="341.0" font-size="14" fill="#ffd23f" font-weight="600" text-anchor="start">corner point</text><text x="300.0" y="565.0" font-size="17" fill="#9aa4b2" font-weight="400" text-anchor="middle" font-style="italic">your room corner, looking up into it</text><text x="600.0" y="318.0" font-size="20" fill="#e8ecf3" font-weight="600" text-anchor="middle">same lines,</text><text x="600.0" y="344.0" font-size="20" fill="#e8ecf3" font-weight="600" text-anchor="middle">two ways to see them</text><line x1="530.0" y1="378.0" x2="670.0" y2="378.0" stroke="#ffd23f" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/><polygon points="670.0,378.0 660.1,382.8 660.1,373.2" fill="#ffd23f" fill-opacity="1.0" stroke="none" stroke-width="0" stroke-linejoin="round"/><polygon points="900.0,335.0 770.1,260.0 900.0,185.0 1029.9,260.0" fill="#4c8dff" fill-opacity="0.95" stroke="none" stroke-width="0" stroke-linejoin="round"/><polygon points="900.0,335.0 770.1,260.0 770.1,410.0 900.0,485.0" fill="#ff8a3d" fill-opacity="0.85" stroke="none" stroke-width="0" stroke-linejoin="round"/><polygon points="900.0,335.0 1029.9,260.0 1029.9,410.0 900.0,485.0" fill="#35d07f" fill-opacity="0.7" stroke="none" stroke-width="0" stroke-linejoin="round"/><line x1="900.0" y1="335.0" x2="770.1" y2="260.0" stroke="#0d1017" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/><line x1="900.0" y1="335.0" x2="1029.9" y2="260.0" stroke="#0d1017" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/><line x1="900.0" y1="335.0" x2="900.0" y2="485.0" stroke="#0d1017" stroke-width="3" stroke-opacity="1.0" stroke-linecap="round"/><text x="900.0" y="565.0" font-size="17" fill="#9aa4b2" font-weight="400" text-anchor="middle" font-style="italic">…or a solid cube poking out</text><text x="40.0" y="610.0" font-size="15" fill="#9aa4b2" font-weight="400" text-anchor="start">Your eyes cannot tell an inside corner from a cube's outside corner when the three faces look the same size.</text><text x="40.0" y="630.0" font-size="15" fill="#9aa4b2" font-weight="400" text-anchor="start">That is the Necker-cube illusion, and this whole project runs on it.</text></svg>